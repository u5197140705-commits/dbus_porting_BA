/**************************************************************************************************/
/* Reference to ELF-file                                                                          */
/**************************************************************************************************/
LOAD ELF_LOCATION NOCODE

/**************************************************************************************************/
/* LOCAL FUNCTIONS                                                                                */
/**************************************************************************************************/
#ifdef RTOS_TRACING_ENABLED
FUNC void SaveTraceData(void)
{
    printf("\nRTOS tracing info:\n");
    printf(  "------------------\n");
    printf("Saving trace data in RTOS_trace_data.hex!\n");
    printf("RTOS_trcBuf: 0x%x - 0x%x\n", &RTOS_traceBuffer, (&RTOS_traceBuffer+0x1));
    exec("SAVE \"./traces/RTOS_trace_data.hex\" &RTOS_traceBuffer , (&RTOS_traceBuffer+0x1)");
}
#else
printf("Info: To enable RTOS tracing set os_tracing_enable to TRUE (@rtos_setup.mak)."); 
#endif

/**************************************************************************************************/
/* BUTTON DEFINITIONS                                                                             */
/**************************************************************************************************/
#ifdef RTOS_TRACING_ENABLED
DEFINE BUTTON "Save Trace Data", "SaveTraceData()"
#endif

