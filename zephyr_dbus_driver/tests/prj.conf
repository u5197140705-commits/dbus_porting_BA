# Project configuration for DBus driver tests

# Enable ZTest for unit testing
CONFIG_ZTEST=y
CONFIG_FPU_SHARING=n
CONFIG_FPU=n
CONFIG_NEWLIB_LIBC=y
CONFIG_PICOLIBC=n


# Enable console and printk for test output
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

# Enable SPI driver for tests (even if mocked, Kconfig might require it)
CONFIG_SPI=y
CONFIG_GPIO=y

# Configurations from main project
CONFIG_HEAP_MEM_POOL_SIZE=256
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_SYS_CLOCK_EXISTS=y
CONFIG_SPI_INIT_PRIORITY=50
CONFIG_DBAL_CROSS_CONNECTION=y
CONFIG_SPI_MCUX_FLEXCOMM=y
CONFIG_DBAL_TARGET_ADDRESS=0x00