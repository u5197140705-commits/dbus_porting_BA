# Enable Zephyr Kernel features
CONFIG_HEAP_MEM_POOL_SIZE=256
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

# Enable console and printk
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

# Enable CAN driver
CONFIG_CAN=y
CONFIG_CAN_LOOPBACK_MODE=y # For testing without hardware
CONFIG_CAN_FD_MODE=n
CONFIG_CAN_AUTO_BUS_OFF_RECOVERY=y
CONFIG_CAN_RX_TIMESTAMP=y
CONFIG_CAN_STATS=y
CONFIG_CAN_DEBUG_LOG=y

# Enable custom DBAL configuration
CONFIG_DBAL_CROSS_CONNECTION=y # Example: Enable cross-connection if needed