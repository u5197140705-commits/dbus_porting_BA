# ==============================
# 🔧 Zephyr Kernel Configuration
# ==============================
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_SYS_CLOCK_EXISTS=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Thread diagnostics and safety
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_SENTINEL=y
CONFIG_STACK_CANARIES=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=n
CONFIG_THREAD_ANALYZER_RUN_UNLOCKED=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y

# ==============================
# 🧾 Logging / Console
# ==============================
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=2048

# RTT console for debugging (optional but great for NXP boards)
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_SEGGER_RTT_PRINTF_BUFFER_SIZE=512
CONFIG_RTT_CONSOLE=y

# ==============================
# ⚙️ Drivers
# ==============================
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SPI_ASYNC=y
CONFIG_SPI_INIT_PRIORITY=70
CONFIG_SPI_MCUX_FLEXCOMM=y

# ==============================
# 💾 Floating-Point Unit (optional)
# ==============================
# Only enable if your app really needs FPU math
# Otherwise it bloats context switching and stack usage
# Disable if not using floats in your code
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ==============================
# 🧩 Custom DBAL (DBus Application Layer)
# ==============================
CONFIG_DBAL_CROSS_CONNECTION=y
CONFIG_DBAL_TARGET_ADDRESS=0x00
CONFIG_DBAL_TX_THREAD_STACK_SIZE=4096
CONFIG_DBAL_RX_THREAD_STACK_SIZE=4096

# ==============================
# 🧪 Testing (optional)
# ==============================
# CONFIG_ZTEST=y

# ==============================
# 🧠 Misc sanity
# ==============================
CONFIG_STACK_ALIGN_DOUBLE_WORD=y
CONFIG_KERNEL_INIT_PRIORITY_DEFAULT=90
