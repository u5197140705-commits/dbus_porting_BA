# --- SPI Slave Stub for STM32G071 ---

# Enable SPI in slave mode
CONFIG_SPI=y
CONFIG_SPI_SLAVE=y

# Enable GPIO
CONFIG_GPIO=y

# Enable logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Thread stack size and memory
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=512

# Debugging / thread info (optional but helpful)
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=y
# CONFIG_STACK_CANARIES is not set
# (or enable below if you want stack protection)
# CONFIG_STACK_CANARIES=y
# CONFIG_STACK_CANARIES_TLS=y
