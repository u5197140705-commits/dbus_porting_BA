# Available runners configured by board.cmake.
runners:
- jlink
- linkserver

# Default flash runner if --runner is not given.
flash-runner: jlink

# Default debug runner if --runner is not given.
debug-runner: jlink

# Common runner configuration values.
config:
  board_dir: /home/swied/zephyrproject/zephyr/boards/nxp/frdm_rw612
  # Build outputs:
  elf_file: zephyr.elf
  bin_file: zephyr.bin
  # Host tools:
  gdb: /home/swied/zephyr-sdk-0.17.0/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb

# Runner specific arguments
args:
  jlink:
    - --dt-flash=y
    - --device=RW612
    - --reset-after-load
  linkserver:
    - --dt-flash=y
    - --device=RW612:FRDM-RW612
